<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>投放看板</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="activitypicker" id="activitypicker" hidden>
        <button type="button" class="activitytoggle" data-activitytoggle aria-haspopup="listbox"
                aria-expanded="false" aria-controls="activitymenu">
          <span id="activitycurrent"></span>
          <i class="activitychevron" aria-hidden="true"></i>
        </button>
        <div class="activitymenu" id="activitymenu" role="listbox" aria-label="切换活动" hidden></div>
      </div>
      <select id="actsel" class="actsel" hidden aria-label="切换活动"></select>
      <h1 id="ttl"></h1>
      <span class="tag" id="coverage"></span>
      <span class="hint" id="fetchstate" style="margin-left:auto"></span>
      <button class="fbtn thresholdbtn" id="thresholdbtn" hidden title="查看当前批门槛">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="8" cy="8" r="1.2" fill="currentColor"/>
          <path d="M8 8l3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span>门槛</span><b id="thresholdbtncount"></b>
      </button>
      <button class="fbtn iconbtn" id="fetchbtn" title="取数" aria-label="取数">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M8 2.2v7.4M8 9.6 4.9 6.5M8 9.6l3.1-3.1" fill="none" stroke="currentColor"
                stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3.2 13h9.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="fbtn iconbtn" id="refresh" title="刷新数据" aria-label="刷新数据">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M12.5 4.2A5.5 5.5 0 1 0 13.5 8" fill="none" stroke="currentColor"
                stroke-width="1.6" stroke-linecap="round"/>
          <path d="M13.7 2.1v3.7h-3.7" fill="none" stroke="currentColor"
                stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="wrap">
    <section>
      <div class="cardhead analyticshead">
        <h2>数据分析</h2>
        <div class="ctl" aria-label="数据分析视角">
          <button class="fbtn on" data-view="date">按日期</button>
          <button class="fbtn" data-view="batch">按批次</button>
        </div>
        <div class="ctl viewmode" aria-label="展示内容">
          <button class="fbtn on" data-analysismode="detail">明细</button>
          <button class="fbtn" data-analysismode="chart">图表</button>
        </div>
      </div>

      <div class="panel">
        <div id="filterbar"></div>
        <div id="summary"></div>
        <div id="chartarea"></div>
        <div id="tablearea"></div>
      </div>
    </section>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modalbox" role="dialog" aria-modal="true" aria-labelledby="mtitle">
      <button class="modalx" id="modalx" aria-label="关闭">×</button>
      <h3 id="mtitle"></h3>
      <div id="mbody"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
