<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>投放看板</title>
<link rel="stylesheet" href="app.css">
</head><body>

<div class="wrap">
  <div class="head"><select id="actsel" class="actsel" hidden aria-label="切换活动"></select><h1 id="ttl"></h1><span class="tag" id="snaptag"></span>
    <span class="hint" id="fetchstate" style="margin-left:auto"></span>
    <button class="fbtn iconbtn todobtn" id="todobtn" hidden title="待复盘（到门槛 · 还没复盘）"
            aria-label="待复盘">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <path d="M3.6 2.6h8.8v10.8H3.6z" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linejoin="round"/>
        <path d="M6 6.4h4M6 9.4h4" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round"/>
      </svg>
      <span class="todocount" id="todocount"></span>
    </button>
    <button class="fbtn iconbtn" id="fetchbtn" title="取数" aria-label="取数">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <path d="M8 2.2v7.4M8 9.6 4.9 6.5M8 9.6l3.1-3.1" fill="none" stroke="currentColor"
              stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3.2 13h9.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="fbtn iconbtn" id="refresh" title="刷新数据" aria-label="刷新数据">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <path d="M12.5 4.2A5.5 5.5 0 1 0 13.5 8" fill="none" stroke="currentColor"
              stroke-width="1.6" stroke-linecap="round"/>
        <path d="M13.7 2.1v3.7h-3.7" fill="none" stroke="currentColor"
              stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button></div>
  <div class="sub" id="subline"></div>
</div>
<div class="wrap">
  <section>
    <div class="cardhead"><h2>分桶统计</h2></div>
    <div class="panel" id="buckets"></div>
  </section>
  <section>
    <div class="cardhead"><h2>批次之间</h2>
      <div class="ctl" id="ctlmode"></div>
      <div class="ctl" id="ctlbs"></div>
    </div>
    <div class="panel" id="batchstats"></div>
  </section>
</div>
<div class="modal" id="modal" hidden>
  <div class="modalbox" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <button class="modalx" id="modalx" aria-label="关闭">×</button>
    <h3 id="mtitle"></h3>
    <div id="mbody"></div>
  </div>
</div>
<script src="app.js"></script>
</body></html>
