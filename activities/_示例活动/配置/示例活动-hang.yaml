# 示例活动（脱敏）：一份能过契约的整活动 YAML。所有值都是占位符，照它写你自己的活动。
# 离线自检：python automation/scripts/check_batch_plan.py --config activities/_示例活动/配置/示例活动-hang.yaml
version: 1
adType: blog-page-t0
label: 示例活动-hang-3类
controls:
  channelType: 页面类
  channel: PC-博客-详情页-相关推荐T0
