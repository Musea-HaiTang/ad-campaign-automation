    isPopup: false
    adClient: 广告
    closeBtnColor: 浅色
  fields:
    title:
      placeholder: 请输入广告标题
    summary:
      placeholder: 请输入广告摘要
      type: textarea
    link:
      placeholder: 请输入点击链接
campaign:
  brand: 示例活动
  owner: hang
  namePrefix: 示例活动-hang
  taskGroupName: 示例活动-hang
  activityLink: https://example.com/activity
