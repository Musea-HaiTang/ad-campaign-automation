# 复盘动作（**人定的调整**）——看板「文案 / 动作」列的数据源之一。
#   **有记录**（这批、这桶已经调整过）→ 页面显示**调整动作**；**没记录** → 回落规则算的**建议动作**。
# 键 = **批次 id**（= 整活动 YAML 的文件名去扩展名）；值 = {桶 id: {keep, drop, new, note}}：
#   keep / drop 写**槽位名**（对照组 / 实验组1 / 实验组2，与后台 AB 组同名）；
#   new = 下一轮补几条新文案（页面不显示，只作记录）；note = 一句话说明（页面图标弹窗里显示）。
#
# 示例（要用就把注释去掉、换成你自己的）：
# buckets:
#   2026-01-08-二批:
#     A: {keep: [对照组], drop: [实验组1], new: 1, note: '对照有点击、实验1 零击，换个角度再试'}
buckets: {}
